project:
  name: agentprep
  seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  logs: logs

# Datasets. Active selects which one the pipeline uses.
data:
  active: adult
  catalog:
    adult:
      target_column: income
      task: classification
      positive_class: ">50K"
      test_size: 0.2
      source_url: ""

models:
  big:
    provider: openai
    name: gpt-4o
    # temperature: 0.0
    # base_url: null
  small:
    provider: openai
    name: gpt-4o-mini

evaluation:
  # Fixed baseline for now (RandomForestClassifier, see agentprep.evaluation).
  # Future plan: the agent chooses among several models (and task types,
  # classification vs. regression) based on the preprocessed data.
  downstream_model: random_forest
  metric: f1
  # f1_average: binary

cost:
  pricing: {}

budget:
  max_retries: 3
  max_usd_per_run: 5
